<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON SYNTH - Neon HTML5 Synthesizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
    <div id="app" class="synth-container">
        
        <!-- Header & Visualizer -->
        <header class="synth-header panel">
            <div class="logo">
                <h1>NEON SYNTH</h1>
            </div>
            <div class="oscilloscope-container">
                <canvas id="oscilloscope"></canvas>
            </div>
            <div class="master-controls">
                <div class="control-group">
                    <label>PRESET</label>
                    <div style="display: flex; gap: 4px; align-items: center;">
                    <select id="preset-select" class="preset-dropdown">
                        <option value="init">INIT PATCH</option>
                        <option value="cyber-bass">CYBER BASS</option>
                        <option value="neon-pad">NEON PAD</option>
                        <option value="acid-pluck">ACID PLUCK</option>
                        <option value="retro-brass">RETRO BRASS</option>
                        <option value="deep-sub">DEEP SUB</option>
                        <option value="synth-bell">SYNTH BELL</option>
                        <option value="solina-strings">SOLINA STRINGS</option>
                        <option value="prodigy-lead">PRODIGY LEAD</option>
                        <option value="juno-pwm-pad">JUNO PWM PAD</option>
                        <option value="wobble-bass">WOBBLE BASS</option>
                        <option value="kick-drum">KICK DRUM</option>
                        <option value="noise-perc">NOISE PERC</option>
                        <option value="drawbar-organ">DRAWBAR ORGAN</option>
                        <option value="arp-dreams">ARP DREAMS</option>
                        <option value="sci-fi-computer">SCI-FI COMPUTER</option>
                        <option value="laser-zap">LASER ZAP</option>
                        <option value="void-drone">VOID DRONE</option>
                    </select>
                    <button id="patch-save" class="mini-btn" title="Save current sound as user patch">SAVE</button>
                    <button id="patch-delete" class="mini-btn" title="Delete selected user patch">DEL</button>
                    <button id="patch-export" class="mini-btn" title="Export project as JSON file">EXP</button>
                    <button id="patch-import" class="mini-btn" title="Import project from JSON file">IMP</button>
                    <input type="file" id="patch-file" accept=".json,application/json" style="display: none;">
                    </div>
                </div>
                <div class="control-group">
                    <label>MASTER</label>
                    <input type="range" id="master-vol" min="0" max="1" step="0.01" value="0.7">
                </div>
                <div class="control-group">
                    <label>VOICES</label>
                    <div class="radio-group">
                        <input type="radio" name="polyphony" id="poly-poly" value="poly" checked>
                        <label for="poly-poly" class="wave-btn">POLY</label>
                        <input type="radio" name="polyphony" id="poly-mono" value="mono">
                        <label for="poly-mono" class="wave-btn">MONO</label>
                        <input type="radio" name="polyphony" id="poly-legato" value="legato">
                        <label for="poly-legato" class="wave-btn">LEGATO</label>
                    </div>
                </div>
                <div class="control-group">
                    <label>MIDI</label>
                    <span id="midi-status" class="led-display" style="min-width: 44px; text-align: center; white-space: nowrap; font-size: 0.7rem;" title="MIDI input status (connect a keyboard and press INIT AUDIO)">--</span>
                </div>
                <button id="power-btn" class="glow-btn power">INIT AUDIO</button>
            </div>
        </header>

        <!-- Synthesizer Engines Grid -->
        <main class="synth-engines">
            
            <!-- Oscillators Section -->
            <section class="oscillators-panel panel module">
                <h2>OSCILLATORS & LFO</h2>
                <div class="vco-grid">
                    <!-- VCO 1 -->
                    <div class="vco-module">
                        <div class="fx-header" style="margin-bottom: 8px;">
                            <label class="switch">
                                <input type="checkbox" id="vco1-on" checked>
                                <span class="slider round"></span>
                            </label>
                            <span style="font-size: 0.9rem; font-weight: bold; color: var(--neon-magenta);">VCO 1</span>
                        </div>
                        <div class="radio-group wave-select">
                            <input type="radio" name="vco1-wave" id="w1-saw" value="sawtooth" checked>
                            <label for="w1-saw" class="wave-btn">SAW</label>
                            <input type="radio" name="vco1-wave" id="w1-sqr" value="square">
                            <label for="w1-sqr" class="wave-btn">SQR</label>
                            <input type="radio" name="vco1-wave" id="w1-tri" value="triangle">
                            <label for="w1-tri" class="wave-btn">TRI</label>
                            <input type="radio" name="vco1-wave" id="w1-sin" value="sine">
                            <label for="w1-sin" class="wave-btn">SIN</label>
                        </div>
                        <div class="controls-row">
                            <div class="control-group">
                                <label>OCT</label>
                                <input type="range" id="vco1-oct" min="-3" max="3" step="1" value="0">
                            </div>
                            <div class="control-group">
                                <label>TUNE</label>
                                <input type="range" id="vco1-tune" min="-1200" max="1200" value="0">
                            </div>
                            <div class="control-group">
                                <label>LVL</label>
                                <input type="range" id="vco1-level" min="0" max="1" step="0.01" value="0.8">
                            </div>
                        </div>
                        <div class="controls-row">
                            <div class="control-group">
                                <label>PW</label>
                                <input type="range" id="vco1-pw" min="0.05" max="0.95" step="0.01" value="0.5">
                            </div>
                            <div class="control-group">
                                <label>PWM</label>
                                <input type="range" id="vco1-pwm" min="0" max="1" step="0.01" value="0">
                            </div>
                            <button id="btn-custom-osc" class="draw-btn" style="margin-left: auto;">DRAW OSC</button>
                        </div>
                    </div>
                    <!-- VCO 2 -->
                    <div class="vco-module">
                        <div class="fx-header" style="margin-bottom: 8px;">
                            <label class="switch">
                                <input type="checkbox" id="vco2-on" checked>
                                <span class="slider round"></span>
                            </label>
                            <span style="font-size: 0.9rem; font-weight: bold; color: var(--neon-magenta);">VCO 2</span>
                        </div>
                        <div class="radio-group wave-select">
                            <input type="radio" name="vco2-wave" id="w2-saw" value="sawtooth">
                            <label for="w2-saw" class="wave-btn">SAW</label>
                            <input type="radio" name="vco2-wave" id="w2-sqr" value="square" checked>
                            <label for="w2-sqr" class="wave-btn">SQR</label>
                            <input type="radio" name="vco2-wave" id="w2-tri" value="triangle">
                            <label for="w2-tri" class="wave-btn">TRI</label>
                            <input type="radio" name="vco2-wave" id="w2-sin" value="sine">
                            <label for="w2-sin" class="wave-btn">SIN</label>
                        </div>
                        <div class="controls-row">
                            <div class="control-group">
                                <label>OCT</label>
                                <input type="range" id="vco2-oct" min="-3" max="3" step="1" value="-1">
                            </div>
                            <div class="control-group">
                                <label>TUNE</label>
                                <input type="range" id="vco2-tune" min="-1200" max="1200" value="7">
                            </div>
                            <div class="control-group">
                                <label>LVL</label>
                                <input type="range" id="vco2-level" min="0" max="1" step="0.01" value="0.6">
                            </div>
                        </div>
                    </div>
                    <!-- VCO 3 -->
                    <div class="vco-module">
                        <div class="fx-header" style="margin-bottom: 8px;">
                            <label class="switch">
                                <input type="checkbox" id="vco3-on" checked>
                                <span class="slider round"></span>
                            </label>
                            <span style="font-size: 0.9rem; font-weight: bold; color: var(--neon-magenta);">VCO 3</span>
                        </div>
                        <div class="radio-group wave-select">
                            <input type="radio" name="vco3-wave" id="w3-saw" value="sawtooth">
                            <label for="w3-saw" class="wave-btn">SAW</label>
                            <input type="radio" name="vco3-wave" id="w3-sqr" value="square">
                            <label for="w3-sqr" class="wave-btn">SQR</label>
                            <input type="radio" name="vco3-wave" id="w3-tri" value="triangle">
                            <label for="w3-tri" class="wave-btn">TRI</label>
                            <input type="radio" name="vco3-wave" id="w3-sin" value="sine" checked>
                            <label for="w3-sin" class="wave-btn">SIN</label>
                        </div>
                        <div class="controls-row">
                            <div class="control-group">
                                <label>OCT</label>
                                <input type="range" id="vco3-oct" min="-3" max="3" step="1" value="1">
                            </div>
                            <div class="control-group">
                                <label>TUNE</label>
                                <input type="range" id="vco3-tune" min="-1200" max="1200" value="-7">
                            </div>
                            <div class="control-group">
                                <label>LVL</label>
                                <input type="range" id="vco3-level" min="0" max="1" step="0.01" value="0.4">
                            </div>
                        </div>
                    </div>

                    <!-- Noise & Glide -->
                    <div style="display: flex; gap: 10px; width: 100%;">
                        <!-- Noise Box -->
                        <div class="mixer-module" style="flex: 1;">
                            <div class="fx-header" style="margin-bottom: 8px;">
                                <span style="font-size: 0.9rem; font-weight: bold; color: var(--neon-cyan);">NOISE</span>
                            </div>
                            <div class="radio-group wave-select">
                                <input type="radio" name="noise-type" id="n-white" value="white" checked>
                                <label for="n-white" class="wave-btn">WHT</label>
                                <input type="radio" name="noise-type" id="n-pink" value="pink">
                                <label for="n-pink" class="wave-btn">PNK</label>
                            </div>
                            <div class="controls-row" style="flex: 1; align-items: center;">
                                <div class="control-group">
                                    <label>LVL</label>
                                    <input type="range" id="noise-level" min="0" max="1" step="0.01" value="0">
                                </div>
                            </div>
                        </div>
                        
                        <!-- Glide Box -->
                        <div class="mixer-module" style="flex: 1;">
                            <div class="fx-header" style="margin-bottom: 8px;">
                                <span style="font-size: 0.9rem; font-weight: bold; color: var(--neon-cyan);">GLIDE</span>
                            </div>
                            <div class="controls-row" style="flex: 1; align-items: center; justify-content: center;">
                                <div class="control-group">
                                    <label>TIME</label>
                                    <input type="range" id="glide-time" min="0" max="2" step="0.01" value="0">
                                </div>
                            </div>
                        </div>

                        <!-- Pitch Env Box -->
                        <div class="mixer-module" style="flex: 1;">
                            <div class="fx-header" style="margin-bottom: 8px;">
                                <span style="font-size: 0.9rem; font-weight: bold; color: var(--neon-cyan);">PITCH ENV</span>
                            </div>
                            <div class="controls-row" style="flex: 1; flex-direction: column; align-items: center; gap: 4px;">
                                <div class="control-group">
                                    <label>AMT (ST)</label>
                                    <input type="range" id="p-env-amt" min="-48" max="48" step="1" value="0">
                                </div>
                                <div class="control-group">
                                    <label>DECAY</label>
                                    <input type="range" id="p-env-d" min="0.01" max="2" step="0.01" value="0.1">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- LFO 1 -->
                    <div class="vco-module">
                        <div class="fx-header" style="margin-bottom: 8px;">
                            <span style="font-size: 0.9rem; font-weight: bold; color: var(--neon-cyan);">LFO 1</span>
                        </div>
                        <div class="radio-group wave-select">
                            <input type="radio" name="lfo1-wave" id="l1-sin" value="sine" checked>
                            <label for="l1-sin" class="wave-btn">SIN</label>
                            <input type="radio" name="lfo1-wave" id="l1-tri" value="triangle">
                            <label for="l1-tri" class="wave-btn">TRI</label>
                            <input type="radio" name="lfo1-wave" id="l1-sqr" value="square">
                            <label for="l1-sqr" class="wave-btn">SQR</label>
                            <input type="radio" name="lfo1-wave" id="l1-saw" value="sawtooth">
                            <label for="l1-saw" class="wave-btn">SAW</label>
                            <input type="radio" name="lfo1-wave" id="l1-rnd" value="random">
                            <label for="l1-rnd" class="wave-btn">RND</label>
                        </div>
                        <div class="controls-row">
                            <div class="control-group">
                                <label>RATE</label>
                                <input type="range" id="lfo1-rate" min="0.1" max="30" step="0.1" value="5">
                            </div>
                            <div class="control-group">
                                <label>-> PITCH</label>
                                <input type="range" id="lfo1-pitch" min="0" max="200" step="1" value="0">
                            </div>
                            <div class="control-group">
                                <label>-> VCF</label>
                                <input type="range" id="lfo1-cutoff" min="0" max="2000" step="10" value="0">
                            </div>
                        </div>
                    </div>

                    <!-- LFO 2 -->
                    <div class="vco-module">
                        <div class="fx-header" style="margin-bottom: 8px;">
                            <span style="font-size: 0.9rem; font-weight: bold; color: var(--neon-cyan);">LFO 2 (TREMOLO)</span>
                        </div>
                        <div class="radio-group wave-select">
                            <input type="radio" name="lfo2-wave" id="l2-sin" value="sine" checked>
                            <label for="l2-sin" class="wave-btn">SIN</label>
                            <input type="radio" name="lfo2-wave" id="l2-tri" value="triangle">
                            <label for="l2-tri" class="wave-btn">TRI</label>
                            <input type="radio" name="lfo2-wave" id="l2-sqr" value="square">
                            <label for="l2-sqr" class="wave-btn">SQR</label>
                            <input type="radio" name="lfo2-wave" id="l2-saw" value="sawtooth">
                            <label for="l2-saw" class="wave-btn">SAW</label>
                            <input type="radio" name="lfo2-wave" id="l2-rnd" value="random">
                            <label for="l2-rnd" class="wave-btn">RND</label>
                        </div>
                        <div class="controls-row">
                            <div class="control-group">
                                <label>RATE</label>
                                <input type="range" id="lfo2-rate" min="0.1" max="30" step="0.1" value="2">
                            </div>
                            <div class="control-group">
                                <label>-> AMP</label>
                                <input type="range" id="lfo2-amp" min="0" max="0.5" step="0.01" value="0">
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Middle Column: Filter & LFO -->
            <div class="mid-col">
                <section class="filter-panel panel module">
                    <h2>VCF (FILTER)</h2>
                    
                    <div class="radio-group wave-select filter-type-select">
                        <input type="radio" name="filter-type" id="f-lp" value="lowpass" checked>
                        <label for="f-lp" class="wave-btn">LP</label>
                        <input type="radio" name="filter-type" id="f-hp" value="highpass">
                        <label for="f-hp" class="wave-btn">HP</label>
                        <input type="radio" name="filter-type" id="f-bp" value="bandpass">
                        <label for="f-bp" class="wave-btn">BP</label>
                        <input type="radio" name="filter-type" id="f-no" value="notch">
                        <label for="f-no" class="wave-btn">NOTCH</label>
                    </div>

                    <div class="controls-row filter-main">
                        <div class="control-group">
                            <label>CUTOFF</label>
                            <!-- Log-scaled: slider position 0..1 maps to 20..20000 Hz -->
                            <input type="range" id="filter-cutoff" min="0" max="1" step="0.005" value="0.625"
                                   data-log-min="20" data-log-max="20000">
                        </div>
                        <div class="control-group">
                            <label>RES (Q)</label>
                            <input type="range" id="filter-res" min="0" max="30" step="0.1" value="2">
                        </div>
                    </div>
                    
                    <h3>VCF ENV</h3>
                    <div class="controls-row env-sliders">
                        <div class="control-group vertical">
                            <input type="range" id="f-env-a" min="0.01" max="5" step="0.01" value="0.1">
                            <label>ATTACK</label>
                        </div>
                        <div class="control-group vertical">
                            <input type="range" id="f-env-d" min="0.01" max="5" step="0.01" value="0.3">
                            <label>DECAY</label>
                        </div>
                        <div class="control-group vertical">
                            <input type="range" id="f-env-s" min="0" max="1" step="0.01" value="0.2">
                            <label>SUSTAIN</label>
                        </div>
                        <div class="control-group vertical">
                            <input type="range" id="f-env-r" min="0.01" max="5" step="0.01" value="0.5">
                            <label>RELEASE</label>
                        </div>
                        <div class="control-group vertical amt">
                            <input type="range" id="f-env-amt" min="-5000" max="5000" step="1" value="2500">
                            <label>AMT</label>
                        </div>
                    </div>
                </section>

                <section class="amp-panel panel module">
                    <h2>VCA (AMP ENV)</h2>
                    <div class="controls-row env-sliders">
                        <div class="control-group vertical">
                            <input type="range" id="a-env-a" min="0.01" max="5" step="0.01" value="0.05">
                            <label>ATTACK</label>
                        </div>
                        <div class="control-group vertical">
                            <input type="range" id="a-env-d" min="0.01" max="5" step="0.01" value="0.5">
                            <label>DECAY</label>
                        </div>
                        <div class="control-group vertical">
                            <input type="range" id="a-env-s" min="0" max="1" step="0.01" value="0.8">
                            <label>SUSTAIN</label>
                        </div>
                        <div class="control-group vertical">
                            <input type="range" id="a-env-r" min="0.01" max="10" step="0.01" value="1.0">
                            <label>RELEASE</label>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Right Column: FX -->
            <div class="right-col">

                <section class="fx-panel panel module">
                    <h2>EFFECTS RACK</h2>
                    <div class="fx-grid">
                        <!-- Distortion -->
                        <div class="fx-module">
                            <div class="fx-header">
                                <label class="switch">
                                    <input type="checkbox" id="dist-on">
                                    <span class="slider round"></span>
                                </label>
                                <span>DISTORTION</span>
                            </div>
                            <div class="controls-row">
                                <div class="control-group">
                                    <label>DRIVE</label>
                                    <input type="range" id="dist-drive" min="0" max="100" value="0">
                                </div>
                            </div>
                        </div>
                        
                        <!-- Delay -->
                        <div class="fx-module">
                            <div class="fx-header">
                                <label class="switch">
                                    <input type="checkbox" id="delay-on">
                                    <span class="slider round"></span>
                                </label>
                                <span>DELAY</span>
                            </div>
                            <div class="controls-row">
                                <div class="control-group">
                                    <label>SYNC</label>
                                    <select id="delay-sync" class="preset-dropdown" style="font-size: 0.7rem; padding: 2px;" title="Sync delay time to the BPM">
                                        <option value="0" selected>FREE</option>
                                        <option value="1">1/4</option>
                                        <option value="0.75">1/8.</option>
                                        <option value="0.5">1/8</option>
                                        <option value="0.3333">1/8T</option>
                                        <option value="0.25">1/16</option>
                                    </select>
                                </div>
                                <div class="control-group">
                                    <label>TIME</label>
                                    <input type="range" id="delay-time" min="0.01" max="1" step="0.01" value="0.3">
                                </div>
                                <div class="control-group">
                                    <label>FDBK</label>
                                    <input type="range" id="delay-fb" min="0" max="0.9" step="0.01" value="0.4">
                                </div>
                                <div class="control-group">
                                    <label>MIX</label>
                                    <input type="range" id="delay-mix" min="0" max="1" step="0.01" value="0.3">
                                </div>
                            </div>
                        </div>

                        <!-- Reverb -->
                        <div class="fx-module">
                            <div class="fx-header">
                                <label class="switch">
                                    <input type="checkbox" id="reverb-on">
                                    <span class="slider round"></span>
                                </label>
                                <span>REVERB</span>
                            </div>
                            <div class="controls-row">
                                <div class="control-group">
                                    <label>MIX</label>
                                    <input type="range" id="reverb-mix" min="0" max="1" step="0.01" value="0.2">
                                </div>
                            </div>
                        </div>

                        <!-- Stereo / Unison (output stage) -->
                        <div class="fx-module">
                            <div class="fx-header">
                                <span>STEREO / UNISON</span>
                            </div>
                            <div class="controls-row">
                                <div class="control-group">
                                    <label>VOICES</label>
                                    <input type="range" id="master-unison" min="1" max="3" step="1" value="1" title="Unison voices per note (poly mode)">
                                </div>
                                <div class="control-group">
                                    <label>DETUNE</label>
                                    <input type="range" id="master-unidetune" min="0" max="50" step="1" value="12" title="Unison detune spread in cents">
                                </div>
                                <div class="control-group">
                                    <label>SPREAD</label>
                                    <input type="range" id="master-spread" min="0" max="1" step="0.01" value="0" title="Stereo width of the voices">
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

        </main>

        <!-- On-Screen Keyboard -->
        <section class="keyboard-panel panel module" style="height: 70px; flex-shrink: 0; padding: 5px;">
            <div class="keyboard" id="piano-keyboard">
                <!-- Keys generated by JS -->
            </div>
        </section>

        <!-- Sequencer -->
        <section class="sequencer-panel panel module">
            <div class="seq-header">
                <h2 style="white-space: nowrap;">SEQUENCER</h2>
                <div class="seq-controls" style="display: flex; gap: 8px; align-items: center; flex: 1; min-width: 0;">
                    <div style="display: flex; gap: 5px;">
                        <button id="seq-play" class="glow-btn play-btn">PLAY</button>
                        <button id="seq-stop" class="glow-btn stop-btn" title="Stop and reset to step 1">STOP</button>
                        <button id="seq-rec" class="glow-btn rec-btn" title="Record played notes into pattern 1 (step entry when stopped, quantized while playing)">REC</button>
                    </div>

                    <div class="control-group horizontal">
                        <label>BPM</label>
                        <input type="range" id="seq-bpm-range" value="120" min="40" max="300" style="width:80px;">
                        <span id="bpm-display" class="led-display">120</span>
                    </div>

                    <div class="control-group horizontal">
                        <label>SWING</label>
                        <input type="range" id="seq-swing" min="0" max="0.75" step="0.05" value="0" style="width:60px;">
                    </div>

                    <div class="control-group horizontal">
                        <label>GATE</label>
                        <input type="range" id="seq-gate" min="0.1" max="1" step="0.05" value="0.8" style="width:60px;">
                    </div>

                    <div class="control-group horizontal">
                        <label>TIME DIV</label>
                        <select id="seq-timediv" class="preset-dropdown" style="font-size: 0.75rem; padding: 3px;">
                            <option value="0.5">1/8</option>
                            <option value="0.25" selected>1/16</option>
                            <option value="0.125">1/32</option>
                        </select>
                    </div>

                    <div class="control-group horizontal" style="gap: 5px; border-left: 1px solid #333; padding-left: 10px;">
                        <label>ARP</label>
                        <label class="switch">
                            <input type="checkbox" id="arp-on">
                            <span class="slider round"></span>
                        </label>
                        <select id="arp-mode" class="preset-dropdown" style="max-width: 86px;">
                            <option value="up">UP</option>
                            <option value="down">DOWN</option>
                            <option value="updown">UP/DOWN (Excl)</option>
                            <option value="updown_inc">UP/DOWN (Incl)</option>
                            <option value="as_played">AS PLAYED</option>
                            <option value="random">RANDOM</option>
                            <option value="converge">CONVERGE</option>
                            <option value="thumb">THUMB</option>
                        </select>
                        <div style="display: flex; flex-direction: column; align-items: center; margin-left: 5px;">
                            <label style="font-size: 0.6rem; margin-bottom: 2px;">LATCH</label>
                            <input type="checkbox" id="arp-latch">
                        </div>
                        <div style="display: flex; flex-direction: column; align-items: center; margin-left: 5px;">
                            <label style="font-size: 0.6rem; margin-bottom: 2px;">OCT</label>
                            <input type="range" id="arp-octaves" min="1" max="3" step="1" value="1" style="width: 40px;">
                        </div>
                    </div>
                    
                    <div class="pattern-select-container" style="margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
                        <!-- Pattern 1 Controls -->
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <div style="font-size: 0.6rem; color: var(--neon-cyan); letter-spacing: 1px;" title="Pattern 1 bank">P1:</div>
                            <div class="pattern-select radio-group" style="display: flex; gap: 2px;">
                                <input type="radio" name="track1-bank" id="t1-pat-a" value="0" checked>
                                <label for="t1-pat-a" class="wave-btn" style="min-width: 20px; height: 20px; line-height: 20px;">A</label>
                                <input type="radio" name="track1-bank" id="t1-pat-b" value="1">
                                <label for="t1-pat-b" class="wave-btn" style="min-width: 20px; height: 20px; line-height: 20px;">B</label>
                                <input type="radio" name="track1-bank" id="t1-pat-c" value="2">
                                <label for="t1-pat-c" class="wave-btn" style="min-width: 20px; height: 20px; line-height: 20px;">C</label>
                                <input type="radio" name="track1-bank" id="t1-pat-d" value="3">
                                <label for="t1-pat-d" class="wave-btn" style="min-width: 20px; height: 20px; line-height: 20px;">D</label>
                                <input type="radio" name="track1-bank" id="t1-pat-e" value="4">
                                <label for="t1-pat-e" class="wave-btn" style="min-width: 20px; height: 20px; line-height: 20px;">E</label>
                                <input type="radio" name="track1-bank" id="t1-pat-f" value="5">
                                <label for="t1-pat-f" class="wave-btn" style="min-width: 20px; height: 20px; line-height: 20px;">F</label>
                                <input type="radio" name="track1-bank" id="t1-pat-g" value="6">
                                <label for="t1-pat-g" class="wave-btn" style="min-width: 20px; height: 20px; line-height: 20px;">G</label>
                                <input type="radio" name="track1-bank" id="t1-pat-h" value="7">
                                <label for="t1-pat-h" class="wave-btn" style="min-width: 20px; height: 20px; line-height: 20px;">H</label>
                            </div>
                            <select id="pat-len-0" class="preset-dropdown" style="font-size: 0.65rem; padding: 1px 2px;" title="Loop length of this track's bank"></select>
                        </div>
                        
                        <!-- Pattern 2 Controls -->
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <div style="font-size: 0.6rem; color: var(--neon-cyan); letter-spacing: 1px;" title="Pattern 2 bank">P2:</div>
                            <div class="pattern-select radio-group" style="display: flex; gap: 2px;">
                                <input type="radio" name="track2-bank" id="t2-pat-a" value="0">
                                <label for="t2-pat-a" class="wave-btn" style="min-width: 20px; height: 20px; line-height: 20px;">A</label>
                                <input type="radio" name="track2-bank" id="t2-pat-b" value="1" checked>
                                <label for="t2-pat-b" class="wave-btn" style="min-width: 20px; height: 20px; line-height: 20px;">B</label>
                                <input type="radio" name="track2-bank" id="t2-pat-c" value="2">
                                <label for="t2-pat-c" class="wave-btn" style="min-width: 20px; height: 20px; line-height: 20px;">C</label>
                                <input type="radio" name="track2-bank" id="t2-pat-d" value="3">
                                <label for="t2-pat-d" class="wave-btn" style="min-width: 20px; height: 20px; line-height: 20px;">D</label>
                                <input type="radio" name="track2-bank" id="t2-pat-e" value="4">
                                <label for="t2-pat-e" class="wave-btn" style="min-width: 20px; height: 20px; line-height: 20px;">E</label>
                                <input type="radio" name="track2-bank" id="t2-pat-f" value="5">
                                <label for="t2-pat-f" class="wave-btn" style="min-width: 20px; height: 20px; line-height: 20px;">F</label>
                                <input type="radio" name="track2-bank" id="t2-pat-g" value="6">
                                <label for="t2-pat-g" class="wave-btn" style="min-width: 20px; height: 20px; line-height: 20px;">G</label>
                                <input type="radio" name="track2-bank" id="t2-pat-h" value="7">
                                <label for="t2-pat-h" class="wave-btn" style="min-width: 20px; height: 20px; line-height: 20px;">H</label>
                            </div>
                            <select id="pat-len-1" class="preset-dropdown" style="font-size: 0.65rem; padding: 1px 2px;" title="Loop length of this track's bank"></select>
                        </div>
                    </div>
                    

                </div>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 6px;">
                <div class="seq-track-container" style="display: flex; gap: 6px; align-items: center;">
                    <div class="pattern-label-col">
                        <button class="pattern-mute-btn active" id="pattern-mute-0" title="Mute/Unmute Pattern 1">P1</button>
                    </div>
                    <div class="seq-grid" id="sequencer-steps-0" style="flex: 1;"></div>
                </div>
                
                <div class="seq-track-container" style="display: flex; gap: 6px; align-items: center;">
                    <div class="pattern-label-col">
                        <button class="pattern-mute-btn active" id="pattern-mute-1" title="Mute/Unmute Pattern 2">P2</button>
                    </div>
                    <div class="seq-grid" id="sequencer-steps-1" style="flex: 1;"></div>
                </div>

                <!-- Song mode: chain of scenes (bank pair + repeats), advances at loop end -->
                <div class="song-row" style="display: flex; gap: 10px; align-items: center;">
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <label style="font-size: 0.65rem; letter-spacing: 1px;">SONG</label>
                        <label class="switch">
                            <input type="checkbox" id="song-mode">
                            <span class="slider round"></span>
                        </label>
                    </div>
                    <button id="song-add" class="mini-btn" title="Append current bank selection as a new scene">+ ADD</button>
                    <button id="song-clear" class="mini-btn" title="Clear the song chain">CLEAR</button>
                    <div id="song-chain" style="display: flex; gap: 4px; flex-wrap: wrap; align-items: center;"></div>
                </div>
            </div>
        </section>

    </div>

    <!-- Custom Osc Modal -->
    <div id="osc-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>DRAW CUSTOM OSCILLATOR</h2>
                <button id="btn-close-modal">X</button>
            </div>
            <div class="modal-body">
                <canvas id="osc-canvas" width="512" height="256"></canvas>
                <div class="modal-controls">
                    <button id="btn-clear-canvas">CLEAR</button>
                    <button id="btn-smooth-canvas">SMOOTH</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
